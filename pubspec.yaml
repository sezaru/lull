name: lull
description: "Ad-free controller for the Pulsetto vagus nerve stimulator."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  clock: ^1.1.2
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_svg: ^2.3.0
  # 13.x needs Android SDK platform 37, which nixpkgs doesn't ship yet.
  permission_handler: ">=12.0.1 <13.0.0"
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  universal_ble: ^3.1.2
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
